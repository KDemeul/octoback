<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#fff5f5" rx="80"/>
  
  <!-- Scale and center the logo -->
  <g transform="translate(56, 36) scale(4)">
    <!-- Left outer tentacle -->
    <path d="M28 48 Q12 52 8 65 Q5 75 12 78 Q18 80 20 72 Q22 64 28 55" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="14" cy="68" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="18" cy="74" rx="2" ry="1.5" fill="#f5a89a"/>
    
    <!-- Left inner tentacle -->
    <path d="M35 55 Q25 62 22 75 Q20 85 28 87 Q35 88 36 78 Q37 68 38 58" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="26" cy="76" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="30" cy="82" rx="2" ry="1.5" fill="#f5a89a"/>

    <!-- Right outer tentacle -->
    <path d="M72 48 Q88 52 92 65 Q95 75 88 78 Q82 80 80 72 Q78 64 72 55" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="86" cy="68" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="82" cy="74" rx="2" ry="1.5" fill="#f5a89a"/>

    <!-- Right inner tentacle -->
    <path d="M65 55 Q75 62 78 75 Q80 85 72 87 Q65 88 64 78 Q63 68 62 58" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="74" cy="76" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="70" cy="82" rx="2" ry="1.5" fill="#f5a89a"/>

    <!-- Bottom left tentacle -->
    <path d="M42 58 Q38 70 40 82 Q42 92 50 90 Q56 88 52 78 Q48 68 46 58" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="44" cy="78" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="48" cy="85" rx="2" ry="1.5" fill="#f5a89a"/>

    <!-- Bottom right tentacle -->
    <path d="M58 58 Q62 70 60 82 Q58 92 50 90 Q44 88 48 78 Q52 68 54 58" 
          fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>
    <ellipse cx="56" cy="78" rx="2.5" ry="1.8" fill="#f5a89a"/>
    <ellipse cx="52" cy="85" rx="2" ry="1.5" fill="#f5a89a"/>

    <!-- Octopus head -->
    <ellipse cx="50" cy="42" rx="24" ry="22" fill="#e85a3c" stroke="#1e2a3a" stroke-width="1.5"/>

    <!-- Eyes - white part -->
    <ellipse cx="40" cy="42" rx="7" ry="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
    <ellipse cx="60" cy="42" rx="7" ry="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>

    <!-- Eyes - pupils -->
    <circle cx="41" cy="43" r="3.5" fill="#1e2a3a"/>
    <circle cx="61" cy="43" r="3.5" fill="#1e2a3a"/>

    <!-- Eye shine -->
    <circle cx="43" cy="41" r="1.2" fill="white"/>
    <circle cx="63" cy="41" r="1.2" fill="white"/>

    <!-- Smile -->
    <path d="M42 52 Q50 58 58 52" stroke="#1e2a3a" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Rosy cheeks -->
    <ellipse cx="30" cy="48" rx="4" ry="2.5" fill="#f5a89a" opacity="0.7"/>
    <ellipse cx="70" cy="48" rx="4" ry="2.5" fill="#f5a89a" opacity="0.7"/>

    <!-- Chef hat - puffy top -->
    <ellipse cx="50" cy="18" rx="14" ry="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
    <circle cx="38" cy="14" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
    <circle cx="62" cy="14" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
    <circle cx="50" cy="10" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>

    <!-- Hat band -->
    <rect x="36" y="22" width="28" height="6" rx="1" fill="white" stroke="#1e2a3a" stroke-width="1"/>

    <!-- Cover hat seams -->
    <ellipse cx="50" cy="16" rx="10" ry="6" fill="white"/>
  </g>
</svg>


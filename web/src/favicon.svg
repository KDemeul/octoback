<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Wave pattern for background -->
    <pattern id="waves" x="0" y="0" width="20" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q5 0 10 3 T20 3" fill="none" stroke="#d4d0c8" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#1e2a3a" stroke-width="4"/>
  
  <!-- Inner background with waves -->
  <circle cx="50" cy="50" r="44" fill="#f5f3ed"/>
  <circle cx="50" cy="50" r="44" fill="url(#waves)"/>
  
  <!-- Anchor icon -->
  <g transform="translate(18, 22) scale(0.35)">
    <path d="M15 8 L15 35 M8 30 Q8 38 15 38 Q22 38 22 30 M10 12 L20 12 M15 4 A4 4 0 1 1 15 12 A4 4 0 1 1 15 4" 
          fill="none" stroke="#1e2a3a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Left tentacles -->
  <path d="M18 58 Q10 62 8 72 Q6 78 12 80 Q18 80 18 74 Q18 68 22 62" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  <path d="M28 65 Q22 72 22 80 Q22 86 28 88 Q34 88 34 82 Q34 76 32 68" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  
  <!-- Right tentacles -->
  <path d="M82 58 Q90 62 92 72 Q94 78 88 80 Q82 80 82 74 Q82 68 78 62" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  <path d="M72 65 Q78 72 78 80 Q78 86 72 88 Q66 88 66 82 Q66 76 68 68" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  
  <!-- Bottom tentacles with suckers -->
  <path d="M38 72 Q34 82 36 90 Q38 96 44 94 Q48 92 46 86 Q44 80 42 74" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  <path d="M62 72 Q66 82 64 90 Q62 96 56 94 Q52 92 54 86 Q56 80 58 74" 
        fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  
  <!-- Sucker details on bottom tentacles -->
  <ellipse cx="40" cy="82" rx="2" ry="1.5" fill="#c44536" stroke="#1e2a3a" stroke-width="0.5"/>
  <ellipse cx="42" cy="88" rx="2" ry="1.5" fill="#c44536" stroke="#1e2a3a" stroke-width="0.5"/>
  <ellipse cx="60" cy="82" rx="2" ry="1.5" fill="#c44536" stroke="#1e2a3a" stroke-width="0.5"/>
  <ellipse cx="58" cy="88" rx="2" ry="1.5" fill="#c44536" stroke="#1e2a3a" stroke-width="0.5"/>
  
  <!-- Octopus head -->
  <ellipse cx="50" cy="48" rx="22" ry="20" fill="#d94c3d" stroke="#1e2a3a" stroke-width="1.5"/>
  
  <!-- Head highlights -->
  <ellipse cx="42" cy="42" rx="3" ry="2" fill="#e8685d" opacity="0.5"/>
  
  <!-- Eyes - white part -->
  <ellipse cx="40" cy="48" rx="6" ry="7" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  <ellipse cx="60" cy="48" rx="6" ry="7" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  
  <!-- Eyes - pupils -->
  <circle cx="41" cy="49" r="3" fill="#1e2a3a"/>
  <circle cx="61" cy="49" r="3" fill="#1e2a3a"/>
  
  <!-- Eye shine -->
  <circle cx="42" cy="47" r="1" fill="white"/>
  <circle cx="62" cy="47" r="1" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M34 40 Q40 38 44 40" fill="none" stroke="#1e2a3a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M56 40 Q60 38 66 40" fill="none" stroke="#1e2a3a" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M43 56 Q50 62 57 56" stroke="#1e2a3a" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Rosy cheeks -->
  <ellipse cx="32" cy="52" rx="4" ry="2.5" fill="#f5a89a" opacity="0.7"/>
  <ellipse cx="68" cy="52" rx="4" ry="2.5" fill="#f5a89a" opacity="0.7"/>
  
  <!-- Chef hat - puffy top -->
  <ellipse cx="50" cy="22" rx="14" ry="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  <circle cx="38" cy="18" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  <circle cx="62" cy="18" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  <circle cx="50" cy="14" r="8" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  
  <!-- Hat band -->
  <rect x="36" y="26" width="28" height="6" rx="1" fill="white" stroke="#1e2a3a" stroke-width="1"/>
  
  <!-- Cover hat seams with white -->
  <ellipse cx="50" cy="20" rx="10" ry="6" fill="white"/>
</svg>
